<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dow Jones Stock Heatmap & Statistics</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #121212; color: #fff; }
    nav { background: #1f1f1f; padding: 15px; margin: -20px -20px 20px -20px; display: flex; gap: 20px; border-bottom: 1px solid #333; }
    nav a { color: #4da6ff; text-decoration: none; font-weight: bold; }
    nav a.active { color: #fff; border-bottom: 2px solid #4da6ff; }

    /* Heatmap Grid Layout */
    .heatmap-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 6px;
      margin-bottom: 30px;
    }
    .stock-block {
      padding: 15px 5px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .block-ticker { font-size: 16px; margin-bottom: 4px; }
    .block-change { font-size: 13px; }

    /* Performance Colors */
    .bg-strong-gain { background-color: #00873c; }
    .bg-mod-gain { background-color: #2e7d32; }
    .bg-mod-loss { background-color: #c62828; }
    .bg-strong-loss { background-color: #d32f2f; }

    /* Tables Layout */
    .tables-wrapper { display: flex; gap: 20px; flex-wrap: wrap; }
    .table-box { flex: 1; min-width: 300px; background: #1e1e1e; padding: 15px; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #333; }
    th { background-color: #2a2a2a; color: #aaa; }
    .text-gain { color: #00e676; font-weight: bold; }
    .text-loss { color: #ff5252; font-weight: bold; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">World Map Indices</a>
    <a href="dow.html" class="active">Dow Jones Heatmap & Gainers/Losers</a>
  </nav>

  <h2>Dow Jones Index Components Heatmap</h2>
  <div id="heatmap" class="heatmap-container">Loading Heatmap...</div>

  <div class="tables-wrapper">
    <div class="table-box">
      <h3 style="color: #00e676;">Top 10 % Gain Stocks (Descending Rise)</h3>
      <table>
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Name</th>
            <th>Price</th>
            <th>Change %</th>
          </tr>
        </thead>
        <tbody id="gainersTable"></tbody>
      </table>
    </div>

    <div class="table-box">
      <h3 style="color: #ff5252;">Top 10 % Loss Stocks (Descending Drop)</h3>
      <table>
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Name</th>
            <th>Price</th>
            <th>Change %</th>
          </tr>
        </thead>
        <tbody id="losersTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Sample Dow Jones subset dataset
    const dowStocks = [
      { ticker: "AAPL", name: "Apple Inc.", price: 182.50, changePct: 2.35 },
      { ticker: "NVDA", name: "NVIDIA Corp.", price: 128.20, changePct: 4.12 },
      { ticker: "MSFT", name: "Microsoft Corp.", price: 448.90, changePct: 1.15 },
      { ticker: "AMZN", name: "Amazon.com Inc.", price: 186.40, changePct: 0.85 },
      { ticker: "META", name: "Meta Platforms", price: 502.30, changePct: 3.40 },
      { ticker: "GOOGL", name: "Alphabet Inc.", price: 177.10, changePct: 1.90 },
      { ticker: "JPM", name: "JPMorgan Chase", price: 198.20, changePct: -0.45 },
      { ticker: "V", name: "Visa Inc.", price: 268.50, changePct: -1.20 },
      { ticker: "PG", name: "Procter & Gamble", price: 165.10, changePct: -1.85 },
      { ticker: "JNJ", name: "Johnson & Johnson", price: 148.60, changePct: -2.40 },
      { ticker: "UNH", name: "UnitedHealth Group", price: 480.20, changePct: -3.10 },
      { ticker: "HD", name: "Home Depot", price: 345.80, changePct: -3.85 },
      { ticker: "CVX", name: "Chevron Corp.", price: 154.30, changePct: 0.25 },
      { ticker: "MRK", name: "Merck & Co.", price: 126.40, changePct: -0.90 },
      { ticker: "KO", name: "Coca-Cola Co.", price: 62.80, changePct: -1.50 },
      { ticker: "DIS", name: "Walt Disney Co.", price: 102.10, changePct: 2.80 },
      { ticker: "CSCO", name: "Cisco Systems", price: 46.70, changePct: 0.40 },
      { ticker: "IBM", name: "IBM Corp.", price: 170.50, changePct: 1.65 },
      { ticker: "CAT", name: "Caterpillar Inc.", price: 325.40, changePct: -2.15 },
      { ticker: "AXP", name: "American Express", price: 228.90, changePct: -0.30 }
    ];

    function renderHeatmap() {
      const heatmap = document.getElementById('heatmap');
      heatmap.innerHTML = '';

      dowStocks.forEach(stock => {
        let bgClass = 'bg-mod-gain';
        if (stock.changePct >= 2.0) bgClass = 'bg-strong-gain';
        else if (stock.changePct < 0 && stock.changePct >= -2.0) bgClass = 'bg-mod-loss';
        else if (stock.changePct < -2.0) bgClass = 'bg-strong-loss';

        const sign = stock.changePct > 0 ? '+' : '';

        const block = document.createElement('div');
        block.className = `stock-block ${bgClass}`;
        block.innerHTML = `
          <div class="block-ticker">${stock.ticker}</div>
          <div class="block-change">${sign}${stock.changePct}%</div>
        `;
        heatmap.appendChild(block);
      });
    }

    function renderTables() {
      // Sort Gainers Descending
      const gainers = [...dowStocks]
        .filter(s => s.changePct > 0)
        .sort((a, b) => b.changePct - a.changePct)
        .slice(0, 10);

      // Sort Losers Descending (by absolute drop severity, e.g., -3.85% before -2.40%)
      const losers = [...dowStocks]
        .filter(s => s.changePct < 0)
        .sort((a, b) => a.changePct - b.changePct)
        .slice(0, 10);

      const gainersTbody = document.getElementById('gainersTable');
      gainersTbody.innerHTML = gainers.map(s => `
        <tr>
          <td><strong>${s.ticker}</strong></td>
          <td>${s.name}</td>
          <td>$${s.price.toFixed(2)}</td>
          <td class="text-gain">+${s.changePct.toFixed(2)}%</td>
        </tr>
      `).join('');

      const losersTbody = document.getElementById('losersTable');
      losersTbody.innerHTML = losers.map(s => `
        <tr>
          <td><strong>${s.ticker}</strong></td>
          <td>${s.name}</td>
          <td>$${s.price.toFixed(2)}</td>
          <td class="text-loss">${s.changePct.toFixed(2)}%</td>
        </tr>
      `).join('');
    }

    renderHeatmap();
    renderTables();
  </script>
</body>
</html>
