<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE 2027 倒數儀表板</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f3efff 0%, #e8ddff 100%);
            --panel-bg: rgba(255, 255, 255, 0.85);
            --banner-bg: #eedeff;
            --text-primary: #2a1b4e;
            --text-muted: #5c5370;
            --purple-accent: #7c3aed;
            --purple-bright: #6d28d9;
            --border-subtle: rgba(216, 190, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2vh;
            overflow: hidden; /* Strict no scroll requirement */
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            height: 92vh;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(124, 58, 237, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.7);
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            overflow: hidden;
        }

        /* Left Side Layout */
        .left-panel {
            padding: 4vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3vh;
            border-right: 1px solid var(--border-subtle);
        }

        .image-style-banner {
            background-color: var(--banner-bg);
            border-radius: 20px;
            padding: 6vh 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative radial rings matching user's image background */
        .image-style-banner::before, .image-style-banner::after {
            content: '';
            position: absolute;
            border: 2px solid rgba(124, 58, 237, 0.05);
            border-radius: 50%;
        }
        .image-style-banner::before {
            width: 140px;
            height: 140px;
            bottom: -50px;
            left: -50px;
        }
        .image-style-banner::after {
            width: 180px;
            height: 180px;
            top: -50px;
            right: -50px;
        }

        .banner-title {
            font-size: 1.3rem;
            color: var(--purple-accent);
            font-weight: 600;
            margin-bottom: 2vh;
            letter-spacing: 0.5px;
        }

        .banner-days {
            font-size: 6rem;
            font-weight: 800;
            color: var(--purple-accent);
            line-height: 1;
            margin-bottom: 3vh;
            display: inline-flex;
            align-items: baseline;
        }

        .banner-days span {
            font-size: 2rem;
            font-weight: 600;
            margin-left: 6px;
        }

        .banner-badge {
            display: inline-block;
            background: var(--purple-accent);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
        }

        .subtitle-tracker {
            text-align: center;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 2vh;
        }

        .subtitle-tracker h3 {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 0.5vh;
            font-weight: 500;
        }

        .subtitle-tracker p {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--purple-bright);
        }

        /* Right Side Layout */
        .right-panel {
            padding: 4vh;
            background: rgba(255, 255, 255, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .right-panel h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 3vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .right-panel h2::after {
            content: '個人科目';
            font-size: 0.8rem;
            background: #eedeec;
            color: var(--purple-accent);
            padding: 4px 12px;
            border-radius: 6px;
        }

        .subject-list {
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        /* Custom minimal scrollbar style if items ever require overflow container containment */
        .subject-list::-webkit-scrollbar {
            width: 4px;
        }
        .subject-list::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 4px;
        }

        .subject-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8vh 20px;
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid rgba(220, 200, 255, 0.3);
            box-shadow: 0 2px 5px rgba(0,0,0,0.01);
        }

        .subject-card.next-up {
            border-color: var(--purple-accent);
            background: #fbf9ff;
        }

        .card-main-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .subject-title {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-primary);
        }

        .subject-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card-countdown {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--purple-accent);
            background: #f6f1ff;
            padding: 6px 14px;
            border-radius: 8px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .subject-card.next-up .card-countdown {
            background: var(--purple-accent);
            color: #ffffff;
        }

        @media (max-width: 850px) {
            body { overflow: auto; height: auto; }
            .dashboard-container { grid-template-columns: 1fr; height: auto; max-height: none; }
            .left-panel { border-right: none; border-bottom: 1px solid var(--border-subtle); }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Left Column: Visual Core Banner Tracker -->
        <div class="left-panel">
            <div class="image-style-banner">
                <div class="banner-title" id="global-title">距離 2027 DSE 開考還有...</div>
                <div class="banner-days" id="global-days">000<span>天</span></div>
                <div>
                    <div class="banner-badge" id="global-badge">開考日 → 2027 年 4 月 8 日</div>
                </div>
            </div>

            <div class="subtitle-tracker">
                <h3>最接近科目的精確剩餘時間</h3>
                <p id="live-precision-timer">00 天 00 時 00 分 00 秒</p>
            </div>
        </div>

        <!-- Right Column: Individual Elective & Core Counter Blocks -->
        <div class="right-panel">
            <h2>應考科目倒數狀態</h2>
            <div class="subject-list" id="subject-list-target">
                <!-- Injected via JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Exact timeline configuration derived from official 2027 HKDSE dataset
        const myExamSchedule = [
            { id: "chi", name: "中國語文 (卷一、卷二)", date: new Date("2027-04-08T08:30:00") },
            { id: "eng", name: "英國語文 (卷一、卷二)", date: new Date("2027-04-09T08:30:00") },
            { id: "eng3", name: "英國語文 (卷三 聆聽綜合)", date: new Date("2027-04-10T09:15:00") },
            { id: "math", name: "數學必修部分 (卷一、卷二)", date: new Date("2027-04-12T08:30:00") },
            { id: "chem", name: "化學 (卷一、卷二)", date: new Date("2027-04-15T08:30:00") },
            { id: "ict", name: "資訊及通訊科技 (卷一、卷二)", date: new Date("2027-04-17T08:30:00") },
            { id: "bio", name: "生物 (卷一、卷二)", date: new Date("2027-04-19T08:30:00") },
            { id: "phy", name: "物理 (卷一、卷二)", date: new Date("2027-04-21T08:30:00") }
        ];

        function runLiveUpdate() {
            const currentTime = new Date();
            const targetContainer = document.getElementById("subject-list-target");
            targetContainer.innerHTML = "";

            // Identify chronological order of upcoming exams
            let currentTargetExam = null;
            for (let exam of myExamSchedule) {
                if (exam.date > currentTime) {
                    currentTargetExam = exam;
                    break;
                }
            }

            // Fallback scenario once all final papers conclude
            if (!currentTargetExam) currentTargetExam = myExamSchedule[myExamSchedule.length - 1];

            // 1. Process Left UI Banner (Matches user's uploaded layout blueprint)
            const overallRemainingMs = currentTargetExam.date - currentTime;
            if (overallRemainingMs > 0) {
                const totalDays = Math.floor(overallRemainingMs / (1000 * 60 * 60 * 24));
                document.getElementById("global-title").innerText = `距離 ${currentTargetExam.name.split(' ')[0]} 開考還有...`;
