<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Indices Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #1a1a1a; color: #fff; }
    nav { background: #2b2b2b; padding: 15px; display: flex; gap: 20px; border-bottom: 1px solid #444; }
    nav a { color: #4da6ff; text-decoration: none; font-weight: bold; }
    nav a.active { color: #fff; border-bottom: 2px solid #4da6ff; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; }
    button { padding: 10px 18px; background-color: #008cba; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #005f73; }
    #map { height: calc(100vh - 160px); width: 100%; }
    .index-popup { color: #000; text-align: center; }
    .gain { color: #00c853; font-weight: bold; }
    .loss { color: #ff3d00; font-weight: bold; }
    footer { padding: 10px 20px; background: #2b2b2b; font-size: 13px; color: #aaa; text-align: center; }
    footer a { color: #4da6ff; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="active">World Map Indices</a>
    <a href="dow.html">Dow Jones Heatmap & Gainers/Losers</a>
  </nav>

  <div class="header-bar">
    <h2>Global Market Indices Overview</h2>
    <button id="refreshBtn" onclick="fetchIndicesData()">Refresh Indices</button>
  </div>

  <div id="map"></div>

  <footer>
    <strong>Data References & Sources:</strong> Market quotes powered by 
    <a href="https://www.aastocks.com" target="_blank">AAStocks.com</a> & 
    <a href="https://www.investing.com" target="_blank">Investing.com</a> Reference Feeds (via Yahoo Finance API Proxy).
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 18
    }).addTo(map);

    const indices = [
      { name: "S&P 500", ticker: "^GSPC", lat: 37.0902, lng: -95.7129 },
      { name: "Dow Jones", ticker: "^DJI", lat: 40.7128, lng: -74.0060 },
      { name: "FTSE 100", ticker: "^FTSE", lat: 51.5074, lng: -0.1278 },
      { name: "DAX", ticker: "^GDAXI", lat: 51.1657, lng: 10.4515 },
      { name: "Nikkei 225", ticker: "^N225", lat: 36.2048, lng: 138.2529 },
      { name: "Hang Seng", ticker: "^HSI", lat: 22.3193, lng: 114.1694 },
      { name: "SSE Composite", ticker: "000001.SS", lat: 31.2304, lng: 121.4737 }
    ];

    let markers = [];

    async function fetchIndicesData() {
      const btn = document.getElementById('refreshBtn');
      btn.innerText = 'Updating...';

      markers.forEach(m => map.removeLayer(m));
      markers = [];

      for (let idx of indices) {
        try {
          const url = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${idx.ticker}`)}`;
          const response = await fetch(url);
          const data = await response.json();
          const result = JSON.parse(data.contents).chart.result[0];
          
          const price = result.meta.regularMarketPrice.toFixed(2);
          const prevClose = result.meta.chartPreviousClose;
          const change = (price - prevClose).toFixed(2);
          const pctChange = (((price - prevClose) / prevClose) * 100).toFixed(2);
          
          const isPositive = change >= 0;
          const colorClass = isPositive ? 'gain' : 'loss';
          const sign = isPositive ? '+' : '';

          const content = `
            <div class="index-popup">
              <h3>${idx.name}</h3>
              <p><strong>${price}</strong></p>
              <p class="${colorClass}">${sign}${change} (${sign}${pctChange}%)</p>
            </div>
          `;

          const marker = L.marker([idx.lat, idx.lng]).addTo(map).bindPopup(content);
          markers.push(marker);
        } catch (e) {
          console.error('Error fetching index:', idx.name, e);
        }
      }
      btn.innerText = 'Refresh Indices';
    }

    fetchIndicesData();
  </script>
</body>
</html>
