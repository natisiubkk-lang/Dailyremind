<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE 2027 倒數儀表板</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fcfaff 0%, #f5efff 100%);
            --panel-bg: #ffffff;
            --banner-bg: #eddfff;
            --text-primary: #251749;
            --text-muted: #6b5f8a;
            --purple-accent: #7348f0; /* 精準對齊圖片中的主紫色 */
            --border-color: #e9defa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3vh;
            overflow: hidden; /* 嚴格禁止頁面滾動 */
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            height: 88vh;
            background: var(--panel-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(115, 72, 240, 0.04);
            border: 1px solid rgba(233, 222, 250, 0.5);
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            overflow: hidden;
        }

        /* 左側欄位（完全還原上傳圖片的雙字卡排版） */
        .left-panel {
            padding: 4vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2.5vh;
            border-right: 1px solid #f3eeff;
        }

        .image-style-banner {
            background-color: var(--banner-bg);
            border-radius: 18px;
            padding: 5vh 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 背景微弱圓圈紋路 */
        .image-style-banner::before, .image-style-banner::after {
            content: '';
            position: absolute;
            border: 2px solid rgba(115, 72, 240, 0.05);
            border-radius: 50%;
        }
        .image-style-banner::before { width: 140px; height: 140px; bottom: -50px; left: -50px; }
        .image-style-banner::after { width: 180px; height: 180px; top: -50px; right: -50px; }

        .banner-title {
            font-size: 1.2rem;
            color: var(--purple-accent);
            font-weight: bold;
            margin-bottom: 2vh;
            letter-spacing: 0.5px;
        }

        .banner-days {
            font-size: 5.5rem;
            font-weight: 800;
            color: var(--purple-accent);
            line-height: 1;
            margin-bottom: 2.5vh;
            display: inline-flex;
            align-items: baseline;
        }

        .banner-days span {
            font-size: 1.8rem;
            font-weight: 600;
            margin-left: 6px;
        }

        .banner-badge {
            display: inline-block;
            background: var(--purple-accent);
            color: #ffffff;
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(115, 72, 240, 0.15);
        }

        .subtitle-tracker {
            text-align: center;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 2.5vh 20px;
        }

        .subtitle-tracker h3 {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1vh;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .subtitle-tracker p {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        /* 右側欄位（考試科目細節列表） */
        .right-panel {
            padding: 4vh;
            background: #faf9fe;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .right-panel h2 {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 2.5vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .right-panel h2::after {
            content: '我的應考科目';
            font-size: 0.8rem;
            background: var(--banner-bg);
            color: var(--purple-accent);
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 500;
        }

        .subject-list {
            display: flex;
            flex-direction: column;
            gap: 1.2vh;
            overflow-y: auto; /* 防止極端解析度下溢出，允許內部滾動 */
            flex: 1;
            padding-right: 4px;
        }

        /* 滾動條美化 */
        .subject-list::-webkit-scrollbar { width: 4px; }
        .subject-list::-webkit-scrollbar-thumb { background: #e1d7f5; border-radius: 4px; }

        .subject-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5vh 20px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(233, 222, 250, 0.6);
            box-shadow: 0 2px 6px rgba(0,0,0,0.01);
            flex-shrink: 0;
        }

        .subject-card.next-up {
            border-color: var(--purple-accent);
            background: #fcfaff;
            box-shadow: 0 4px 12px rgba(115, 72, 240, 0.04);
        }

        .card-main-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .subject-title {
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .subject-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card-countdown {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--purple-accent);
            background: #f4efff;
            padding: 6px 14px;
            border-radius: 8px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            min-width: 100px;
        }

        .subject-card.next-up .card-countdown {
            background: var(--purple-accent);
            color: #ffffff;
        }

        @media (max-width: 850px) {
            body { overflow: auto; height: auto; }
            .dashboard-container { grid-template-columns: 1fr; height: auto; max-height: none; }
            .left-panel { border-right: none; border-bottom: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- 左側：主計時核心面版 -->
        <div class="left-panel">
            <div class="image-style-banner">
                <div class="banner-title" id="global-title">距離 2027 DSE 開考還有...</div>
                <div class="banner-days" id="global-days">000<span>天</span></div>
                <div>
                    <div class="banner-badge" id="global-badge">開考日 → 2027 年 4 月 8 日</div>
                </div>
            </div>

            <div class="subtitle-tracker">
                <h3 id="target-sub-title">距離下一科考試精確時間</h3>
                <p id="live-precision-timer">000 天 00 時 00 分 00 秒</p>
            </div>
        </div>

        <!-- 右側：科目卡片詳情面板 -->
        <div class="right-panel">
            <h2>應考科目倒數狀態</h2>
            <div class="subject-list" id="subject-list-target">
                <!-- 由 JavaScript 於頁面載入時自動初始化 -->
            </div>
        </div>
    </div>

    <script>
        // 2027年 DSE 官方科目時間表數據設定
        const myExamSchedule = [
            { id: "chi", name: "中國語文 (卷一、卷二)", date: new Date("2027-04-08T08:30:00") },
            { id: "eng", name: "英國語文 (卷一、卷二)", date: new Date("2027-04-09T08:30:00") },
            { id: "eng3", name: "英國語文 (卷三 聆聽綜合)", date: new Date("2027-04-10T09:15:00") },
            { id: "math", name: "數學必修部分 (卷一、卷二)", date: new Date("2027-04-12T08:30:00") },
            { id: "chem", name: "化學 (卷一、卷二)", date: new Date("2027-04-15T08:30:00") },
            { id: "ict", name: "資訊及通訊科技 (卷一、卷二)", date: new Date("2027-04-17T08:30:00") },
            { id: "bio", name: "生物 (卷一、卷二)", date: new Date("2027-04-19T08:30:00") },
            { id: "phy", name: "物理 (卷一、卷二)", date: new Date("2027-04-21T08:30:00") }
        ];

        // 1. 初始化右側清單（確保 DOM 節點立即可見，避免網頁一片空白）
        function initializeSubjectCards() {
            const container = document.getElementById("subject-list-target");
            container.innerHTML = "";

            myExamSchedule.forEach((exam) => {
                const localeDateString = exam.date.toLocaleDateString('zh-HK', { month: 'short', day: 'numeric', weekday: 'short' });
                const localeTimeString = exam.date.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });

                const card = document.createElement("div");
                card.className = "subject-card";
                card.id = `card-${exam.id}`;
                card.innerHTML = `
                    <div class="card-main-info">
                        <div class="subject-title">${exam.name}</div>
                        <div class="subject-meta">📅 ${localeDateString} — ${localeTimeString} AM</div>
                    </div>
                    <div class="card-countdown" id="countdown-${exam.id}">計算中...</div>
                `;
                container.appendChild(card);
            });
        }

        // 2. 核心倒數計算函數（每秒觸發，精確抓取當下時間差）
        function runLiveUpdate() {
            const currentTime = new Date();

            // 找出最接近的下一場考試
            let currentTargetExam = null;
            for (let exam of myExamSchedule) {
